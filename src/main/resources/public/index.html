<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-layer-group"></i>
                <h2>Media Tracker</h2>
            </div>
            
            <nav class="filter-nav">
                <p class="nav-label">CATEGORIES</p>
                <button class="nav-btn active" data-filter="All">
                    <i class="fa-solid fa-border-all"></i> All Media
                </button>
                <button class="nav-btn" data-filter="Anime">
                    <i class="fa-solid fa-tv"></i> Anime
                </button>
                <button class="nav-btn" data-filter="Movie">
                    <i class="fa-solid fa-film"></i> Movies
                </button>
                <button class="nav-btn" data-filter="Book">
                    <i class="fa-solid fa-book"></i> Books
                </button>
                <button class="nav-btn" data-filter="Manga">
                    <i class="fa-solid fa-book-open-reader"></i> Manga
                </button>
                <button class="nav-btn" data-filter="Manhwa">
                    <i class="fa-solid fa-scroll"></i> Manhwa
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Action Header -->
            <header class="top-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search by title, ID, or genre...">
                </div>
                
                <div class="header-actions">
                    <button class="btn btn-primary" id="open-add-modal-btn">
                        <i class="fa-solid fa-plus"></i> Add New Media
                    </button>
                </div>
            </header>

            <!-- Media Data Table Container -->
            <section class="table-container">
                <table class="media-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Genre</th>
                            <th>Rating</th>
                            <th>Status</th>
                            <th id="metric-header">Metric</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="media-table-body">
                        <!-- Dynamic rows populated by app.js -->
                    </tbody>
                </table>

                <div id="empty-state" class="empty-state hidden">
                    <i class="fa-solid fa-folder-open"></i>
                    <p>No media records found.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Add / Edit Media Modal -->
    <div id="media-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Add New Media</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            
            <form id="media-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="media-id">Media ID</label>
                        <input type="text" id="media-id" required placeholder="e.g., A01, B02">
                    </div>

                    <div class="form-group">
                        <label for="media-type">Media Type</label>
                        <select id="media-type" required>
                            <option value="Anime">Anime</option>
                            <option value="Movie">Movie</option>
                            <option value="Book">Book</option>
                            <option value="Manga">Manga</option>
                            <option value="Manhwa">Manhwa</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="media-title">Title</label>
                        <input type="text" id="media-title" required placeholder="Enter full title">
                    </div>

                    <div class="form-group">
                        <label for="media-genre">Genre</label>
                        <input type="text" id="media-genre" placeholder="e.g., Action, Sci-Fi">
                    </div>

                    <div class="form-group">
                        <label for="media-rating">Rating (0.0 - 10.0)</label>
                        <input type="number" id="media-rating" step="0.1" min="0" max="10" placeholder="9.5">
                    </div>

                    <div class="form-group">
                        <label for="media-status">Status</label>
                        <select id="media-status">
                            <option value="Unconsumed">Unconsumed</option>
                            <option value="Currently Consuming">Currently Consuming</option>
                            <option value="Finished">Finished</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="media-extra" id="extra-label">Episodes</label>
                        <input type="number" id="media-extra" min="0" placeholder="Count" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="media-link">Source / Web Link</label>
                        <input type="url" id="media-link" placeholder="https://example.com/watch">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save Media</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
